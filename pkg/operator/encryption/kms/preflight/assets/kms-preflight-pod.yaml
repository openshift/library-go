apiVersion: v1
kind: Pod
metadata:
  name: {{.PodName}}
  namespace: {{.Namespace}}
  labels:
    # This is used in the operands network AllowLists. Changes here need to reflect in all dependent operators.
    app: openshift-kms-preflight
  annotations:
    {{.ConfigHashAnnotationKey}}: {{.ConfigHash}}
spec:
  # This is a one-shot preflight check, not a long-running pod.
  # The operator creates it, waits for completion, and inspects the result.
  restartPolicy: Never
  serviceAccountName: kms-preflight
  priorityClassName: system-cluster-critical
  nodeSelector:
    node-role.kubernetes.io/master: ""
  tolerations:
    # Ensure pod can be scheduled on master nodes
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoExecute"
{{- if .StaticPod}}
  hostNetwork: true
{{- end}}
  containers:
    - name: kms-preflight-check
      image: {{.OperatorImage}}
      command: [{{.Command}}]
      args:
        - --kms-call-timeout={{.KMSCallTimeout}}
        # Flag names stay --pod-* for CLI/CI compatibility; values are the fixed
        # preflight Job name/namespace (Job pods have generated names).
        - --pod-name={{.PodName}}
        - --pod-namespace={{.Namespace}}
      # TODO: figure out good resource request values.
      resources:
        requests:
          memory: 50Mi
          cpu: 5m
